apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: finanalytics }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: finanalytics/backend:latest
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            {
              httpGet: { path: /ready, port: 8000 },
              initialDelaySeconds: 10,
              periodSeconds: 10,
            }
          livenessProbe:
            {
              httpGet: { path: /health, port: 8000 },
              initialDelaySeconds: 10,
              periodSeconds: 20,
            }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: finanalytics }
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
